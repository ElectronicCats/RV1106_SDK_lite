[COMPRESSION]
COMPRESSION=gzip
[MCU]
# CubeSat: SPL starts rtthread directly at 0x40000. The bootrom already loads
# rtthread.bin there (RKBOOT Hpmcu, LOAD_ADDR=0x40000, FLAG=0x10007); this MCU0
# entry loads it again from the uboot FIT (harmless) and, crucially, runs the
# FULL release sequence in rv1106.c spl_fit_standalone_release(): cache GRF cfg
# -> hold SCR1 reset -> SGRF boot addr = 0x40000 -> RELEASE.
#
# Why not the Rockchip hpmcu_wrap: the wrap is a mailbox COMMAND INTERPRETER
# (polls MAILBOX 0xff5c0000 for meta commands) — it never jumps to 0x40000 by
# itself; the sender is rk_meta_process() in the PREBUILT rkbin SPL, which our
# source-built SPL stubs out. With the wrap the SCR1 just parks forever.
# Why MCU0 and not MCU1: only the "mcu0" id releases the SCR1; "mcu1" only sets
# the boot address (used by flows where someone else releases, e.g. WAKEUP).
# Releasing to 0x40000 is proven silicon behavior: Rockchip's own WAKEUP flow
# releases the SCR1 to its firmware at 0x40000.
MCU0=bin/rv11/rtthread.bin,0x40000,okay
